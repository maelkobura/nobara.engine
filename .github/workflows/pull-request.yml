name: Pull request

# The title and description become the squashed commit, so the checks run
# again whenever either of them is edited.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title-and-description:
    name: Title and description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Values go through the environment, never through shell interpolation.
      - name: Check title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          python .github/scripts/check_pr.py --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.txt"
