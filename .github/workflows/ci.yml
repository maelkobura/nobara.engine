name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet pack tools/Nobara.Sdk -c Release -o artifacts/packages --nologo
      # Writes obj/nobara/modules.props and fails when Nobara.slnx is out of date.
      - run: dotnet run --project tools/Nobara.Cli -- generate --check
      - run: dotnet build Nobara.slnx --nologo
      - run: dotnet test Nobara.slnx --nologo

  module-sheets:
    name: Module sheets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Fails when a section generated from module.nobara is out of date.
      - run: dotnet run --project tools/Nobara.Cli -- docs --check

  headers:
    name: License headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_headers.py

  terms:
    name: Forbidden terms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/check_terms.py

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Keep the markdownlint version in sync with .github/scripts/check_all.py.
      - run: npx --yes markdownlint-cli2@0.18.1 "docs/**/*.md" README.md AGENTS.md "src/*/README.md" "tools/*/README.md"
      - run: python .github/scripts/check_links.py

  scripts:
    name: Check scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s .github/scripts/tests -v
