// What the build embeds in place of a GLSL source: its SPIR-V, once per set
// of macros that the shaders that use the source ask for. Not a resource
// type.
syntax = "proto3";

package nobara.renderer;

option csharp_namespace = "Nobara.Renderer.Schemas";

// The SPIR-V of one GLSL source.
message CompiledStage {
  // vertex, fragment, or compute.
  string stage = 1;

  // One module per set of macros.
  repeated CompiledVariant variant = 2;
}

// The SPIR-V of a source compiled with one set of macros.
message CompiledVariant {
  // The macros, sorted and joined by line breaks; empty for none.
  string defines = 1;

  // The SPIR-V module, entry point main.
  bytes spirv = 2;
}
