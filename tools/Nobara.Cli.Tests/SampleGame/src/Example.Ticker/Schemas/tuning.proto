syntax = "proto3";

package example.ticker;

import "nobara/options.proto";

option csharp_namespace = "Example.Ticker.Schemas";

message Tuning {
  option (nobara.resource_type) = "tuning";

  int32 speed = 1;
  int32 stop_after_ticks = 2;
}
