// The resource type of the hot reload tests.
syntax = "proto3";

package nobara.hotreloadtests;

import "nobara/options.proto";

option csharp_namespace = "Nobara.HotReload.Tests.Schemas";

message Gadget {
  option (nobara.resource_type) = "gadget";

  int32 power = 1;
  string manual = 2 [(nobara.file) = true];
}
