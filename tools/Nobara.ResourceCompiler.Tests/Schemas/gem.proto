// The resource type of the test plugin, which provides it as a descriptor.
syntax = "proto3";

package nobara.tests.gems;

import "nobara/options.proto";

option csharp_namespace = "Nobara.ResourceCompiler.Tests.Schemas";

message Gem {
  option (nobara.resource_type) = "gem";

  string color = 1 [(nobara.required) = true];
  int32 carats = 2 [(nobara.min) = 1];
  bool create_item = 3;
}
